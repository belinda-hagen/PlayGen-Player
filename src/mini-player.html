<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PlayGen Mini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      height: 80px;
      overflow: hidden;
      background: #0b0b0b;
      color: #fff;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      -webkit-app-region: drag;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .mini-player {
      height: 100%;
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background:
        linear-gradient(145deg, rgba(255, 45, 120, 0.16), rgba(168, 85, 247, 0.08) 48%, rgba(255, 138, 42, 0.1)),
        #0b0b0b;
    }

    .mini-thumb {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      overflow: hidden;
      background: #242424;
      color: #727272;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.36);
    }

    .mini-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .mini-thumb img.visible {
      display: block;
    }

    .mini-thumb img.visible + svg {
      display: none;
    }

    .mini-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mini-title,
    .mini-channel {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-title {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }

    .mini-channel {
      font-size: 11px;
      color: #b3b3b3;
      font-weight: 600;
    }

    .mini-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .mini-btn {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #b3b3b3;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .mini-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .mini-btn.play-btn {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #ff2d78 0%, #a855f7 52%, #ff8a2a 100%);
      color: #fff;
    }

    .mini-btn.play-btn:hover {
      transform: scale(1.06);
      filter: brightness(1.08);
    }

    .mini-btn.close-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      font-size: 10px;
      -webkit-app-region: no-drag;
    }

    .mini-btn.close-btn:hover {
      color: #fff;
      background: #f15e6c;
    }

    .mini-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }

    .mini-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff2d78 0%, #a855f7 52%, #ff8a2a 100%);
      transition: width 0.5s linear;
    }
  </style>
</head>
<body>
  <div class="mini-player">
    <div class="mini-thumb" id="mini-thumb">
      <img id="mini-thumb-img" src="" alt="">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
    </div>
    <div class="mini-info">
      <div class="mini-title" id="mini-title">No song playing</div>
      <div class="mini-channel" id="mini-channel"></div>
    </div>
    <div class="mini-controls">
      <button class="mini-btn" id="btn-prev" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
          <polygon points="19,20 9,12 19,4"/><rect x="5" y="4" width="2" height="16"/>
        </svg>
      </button>
      <button class="mini-btn play-btn" id="btn-play" title="Play/Pause">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" id="play-icon">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
      </button>
      <button class="mini-btn" id="btn-next" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
          <polygon points="5,4 15,12 5,20"/><rect x="17" y="4" width="2" height="16"/>
        </svg>
      </button>
    </div>
    <button class="mini-btn close-btn" id="btn-close" title="Close mini player">x</button>
  </div>
  <div class="mini-progress">
    <div class="mini-progress-fill" id="mini-progress-fill"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const els = {
      title: document.getElementById('mini-title'),
      channel: document.getElementById('mini-channel'),
      thumbImg: document.getElementById('mini-thumb-img'),
      playIcon: document.getElementById('play-icon'),
      progressFill: document.getElementById('mini-progress-fill'),
    };

    ipcRenderer.on('mini-player-update', (event, data) => {
      if (data.title) els.title.textContent = data.title;
      if (data.channel !== undefined) els.channel.textContent = data.channel;
      if (data.thumbnail) {
        els.thumbImg.src = data.thumbnail;
        els.thumbImg.classList.add('visible');
      }
      if (data.isPlaying !== undefined) {
        els.playIcon.innerHTML = data.isPlaying
          ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
          : '<polygon points="5,3 19,12 5,21"/>';
      }
      if (data.progress !== undefined) {
        els.progressFill.style.width = data.progress + '%';
      }
    });

    document.getElementById('btn-play').addEventListener('click', () => {
      ipcRenderer.send('mini-player-command', 'toggle-play');
    });
    document.getElementById('btn-prev').addEventListener('click', () => {
      ipcRenderer.send('mini-player-command', 'prev');
    });
    document.getElementById('btn-next').addEventListener('click', () => {
      ipcRenderer.send('mini-player-command', 'next');
    });
    document.getElementById('btn-close').addEventListener('click', () => {
      ipcRenderer.send('mini-player-command', 'close');
    });
    document.body.addEventListener('dblclick', () => {
      ipcRenderer.send('mini-player-command', 'restore');
    });
  </script>
</body>
</html>
